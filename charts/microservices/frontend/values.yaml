replicaCount: 1

env: dev

image:
  repository: us-central1-docker.pkg.dev/project-1cdbea51-6334-4e02-967/app-images/frontend
  tag: "v0.1.20"
  pullPolicy: IfNotPresent

terminationGracePeriodSeconds: 5

annotations:
  sidecar.istio.io/rewriteAppHTTPProbers: "true"
  instrumentation.opentelemetry.io/inject-go: "boutique/app-instrumentation"
  instrumentation.opentelemetry.io/otel-go-auto-target-exe: "/src/server"
  resource.opentelemetry.io/service.name: "frontend"

shareProcessNamespace: true

containers:
  - name: server
    ports:
      - containerPort: 8080
        name: http
    securityContext:
      privileged: true
    readinessProbe:
      initialDelaySeconds: 10
      httpGet:
        path: "/_healthz"
        port: 8080
        httpHeaders:
          - name: "Cookie"
            value: "shop_session-id=x-readiness-probe"
    livenessProbe:
      initialDelaySeconds: 10
      httpGet:
        path: "/_healthz"
        port: 8080
        httpHeaders:
          - name: "Cookie"
            value: "shop_session-id=x-liveness-probe"
    env:
      - name: PORT
        value: "8080"
      - name: LOG_FORMAT
        value: "json"
      - name: SHOPPING_ASSISTANT_SERVICE_ADDR
        value: "shoppingassistantservice:80"
      - name: ENV_PLATFORM
        value: "gcp"

    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

service:
  enabled: true
  type: ClusterIP
  name: http
  port: 80
  targetPort: 8080
  annotations:
    cloud.google.com/neg: '{"ingress": true}'

serviceAccount:
  create: true
  name: "frontend"

gateway:
  enabled: true
  host: dev.tanyadominicsheytech.eu
  gatewayName: boutique-gateway
  gatewayNamespace: platform

releaseInfo:
  enabled: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1
