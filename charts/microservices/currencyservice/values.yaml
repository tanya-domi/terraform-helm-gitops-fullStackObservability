replicaCount: 1

env: dev


image:
  repository: us-central1-docker.pkg.dev/project-1cdbea51-6334-4e02-967/app-images/currencyservice
  tag: "v0.1.20"
  pullPolicy: IfNotPresent

terminationGracePeriodSeconds: 5

annotations:
  instrumentation.opentelemetry.io/inject-nodejs: "app-instrumentation"
  resource.opentelemetry.io/service.name: "currencyservice"

containers:
  - name: server
    ports:
      - containerPort: 7000
        name: grpc
    env:
      - name: PORT
        value: "7000"
      - name: DISABLE_PROFILER
        value: "1"
      - name: OTEL_SERVICE_NAME
        value: "currencyservice"

    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      grpc:
        port: 7000

    livenessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      grpc:
        port: 7000

    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

service:
  enabled: true
  type: ClusterIP
  name: grpc
  port: 7000
  targetPort: 7000

serviceAccount:
  create: true
  name: "currencyservice"

podDisruptionBudget:
  enabled: false
  minAvailable: 1