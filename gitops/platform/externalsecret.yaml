# Application Layer (namespace: boutique)
# cartservice is configured to read REDIS_ADDR via a secretKeyRef

# 1. Dev Environment App Secret
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-secret-sync
  namespace: dev
spec:
  refreshInterval: "5m"
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: redis-secret       # Matches cartservice's secretKeyRef name
    creationPolicy: Owner
  data:
    - secretKey: redis-address   # Matches cartservice's secretKeyRef key
      remoteRef:
        key: redis-endpoint-dev   # Pulls dev secret from GCP
---
# 2. Stage Environment App Secret
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-secret-sync
  namespace: stage
spec:
  refreshInterval: "5m"
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: redis-secret       # Matches cartservice's secretKeyRef name
    creationPolicy: Owner
  data:
    - secretKey: redis-address   # Matches cartservice's secretKeyRef key
      remoteRef:
        key: redis-endpoint-stage # Pulls stage secret from GCP
---
# 3. Prod Environment App Secret
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-secret-sync
  namespace: prod
spec:
  refreshInterval: "5m"
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: redis-secret       # Matches cartservice's secretKeyRef name
    creationPolicy: Owner
  data:
    - secretKey: redis-address   # Matches cartservice's secretKeyRef key
      remoteRef:
        key: redis-endpoint-prod  # Pulls prod secret from GCP
---
# 4. Observability Layer (namespace: monitoring)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: otel-redis-secret-bridge
  namespace: monitoring
spec:
  refreshInterval: "5m"
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: prod-redis-endpoint    # Matches what otel-collector.yaml expects
    creationPolicy: Owner
  data:
    - secretKey: redis-endpoint  # Matches what otel-collector.yaml expects
      remoteRef:
        key: prod-redis-endpoint # Pulls directly from GCP