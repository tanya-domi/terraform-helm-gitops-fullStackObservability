apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # Ensures operator and CRDs install first
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: "2.8.0" 
    helm:
      values: |
        installCRDs: true
        serviceAccount:
          create: true
          name: "external-secrets-sa"
          annotations:
            iam.gke.io/gcp-service-account: "eso-gcp-sa@project-1cdbea51-6334-4e02-967.iam.gserviceaccount.com"
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true