apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-components
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
spec:
  project: boutique-platform
  source:
    repoURL: https://github.com/tanya-domi/terraform-helm-gitops-fullStackObservability.git
    targetRevision: main
    path: gitops/bootstrap/argocd-components
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true