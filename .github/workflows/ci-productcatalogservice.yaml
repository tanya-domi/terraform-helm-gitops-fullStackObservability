name: CI productcatalogservice

permissions:
  contents: write
  id-token: write
  pull-requests: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/productcatalogservice/**"
      - "charts/microservices/productcatalogservice/**"
      - ".github/workflows/reusable-service-ci.yaml"
      - ".github/workflows/ci-productcatalogservice.yml"

  pull_request:
    branches: [main]
    paths:
      - "apps/productcatalogservice/**"
      - "charts/microservices/productcatalogservice/**"

jobs:
  ci:
    uses: ./.github/workflows/reusable-service-ci.yaml
    with:
      service: productcatalogservice
    secrets: inherit
