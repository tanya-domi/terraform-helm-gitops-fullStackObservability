name: CI loadgenerator

permissions:
  contents: write
  id-token: write
  pull-requests: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/loadgenerator/**"
      - "charts/microservices/loadgenerator/**"
      - ".github/workflows/reusable-service-ci.yaml"
      - ".github/workflows/ci-loadgenerator.yml"


  pull_request:
    branches: [main]
    paths:
      - "apps/loadgenerator/**"
      - "charts/microservices/loadgenerator/**"

jobs:
  ci:
    uses: ./.github/workflows/reusable-service-ci.yaml
    with:
      service: loadgenerator
    secrets: inherit
