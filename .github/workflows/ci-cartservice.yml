name: CI cartservice

permissions:
  contents: write
  id-token: write
  pull-requests: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/cartservice/**"
      - "charts/microservices/cartservice/**"
      - ".github/workflows/reusable-service-ci.yaml"
      - ".github/workflows/ci-cartservice.yml"

  pull_request:
    branches: [main]
    paths:
      - "apps/cartservice/**"
      - "charts/microservices/cartservice/**"

jobs:
  ci:
    uses: ./.github/workflows/reusable-service-ci.yaml
    with:
      service: cartservice
    secrets: inherit
