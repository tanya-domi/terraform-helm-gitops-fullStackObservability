name: Reusable Service CI/CD

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    environment: build
    env:
      SERVICE: ${{ inputs.service }}
      # Aligned with terraform artifact_repository_urls map
      GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      AR_REPO: ${{ vars.AR_REPO || 'dev-app-images' }}

    steps:
      # 1. Checkout Code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Resolve Metadata
      - name: Resolve service metadata
        id: meta
        run: |
          json_file="scripts/services.json"
          [ -f "$json_file" ] || json_file="service.json"

          lang=$(jq -r ".[\"${SERVICE}\"].language // empty" "$json_file")
          dockerfile=$(jq -r ".[\"${SERVICE}\"].dockerfile" "$json_file")
          context=$(jq -r ".[\"${SERVICE}\"].context" "$json_file")
          
          echo "language=${lang}" >> "$GITHUB_OUTPUT"
          echo "dockerfile=${dockerfile}" >> "$GITHUB_OUTPUT"
          echo "context=${context}" >> "$GITHUB_OUTPUT"
          echo "image=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}/${SERVICE}" >> "$GITHUB_OUTPUT"

      # 3. Setup Language Runtimes & Unit Tests
      - name: Setup Go
        if: steps.meta.outputs.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run Go tests
        if: steps.meta.outputs.language == 'go'
        run: cd ${{ steps.meta.outputs.context }} && go test ./... -v

      - name: Setup .NET
        if: steps.meta.outputs.language == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run .NET tests
        if: steps.meta.outputs.language == 'dotnet'
        run: cd ${{ steps.meta.outputs.context }} && dotnet test

      - name: Setup Node.js
        if: steps.meta.outputs.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Node tests
        if: steps.meta.outputs.language == 'node'
        run: cd ${{ steps.meta.outputs.context }} && npm ci && npm test

      - name: Setup Python
        if: steps.meta.outputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Python tests
        if: steps.meta.outputs.language == 'python'
        run: cd ${{ steps.meta.outputs.context }} && pip install -r requirements.txt && pytest

      # # 4. Trivy Static Analysis & SonarCloud
      # - name: Run Trivy Code / Dependency Scan
      #   uses: aquasecurity/trivy-action@0.29.0
      #   with:
      #     scan-type: 'fs'
      #     scan-ref: '${{ steps.meta.outputs.context }}'
      #     format: 'table'
      #     severity: 'HIGH,CRITICAL'

      # - name: SonarCloud Scan
      #   uses: SonarSource/sonarcloud-github-action@v3
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #   with:
      #     projectBaseDir: ${{ steps.meta.outputs.context }}
      #     args: >
      #       -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
      #       -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_PREFIX }}_${{ inputs.service }}
      #       -Dsonar.sources=.
      #       -Dsonar.exclusions=**/node_modules/**,**/bin/**,**/obj/**,**/*.test.js

      # - name: SonarCloud Quality Gate Check
      #   uses: sonarsource/sonarcloud-quality-gate-action@v1
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #   timeout-minutes: 5

      # 5. Auth & Setup Buildx
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_BUILD_SA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GCP Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # 6. Optimized Build and Push with GHA Caching
      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.meta.outputs.context }}
          file: ${{ steps.meta.outputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 7. Generate Syft SBOM on Remote Image
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM
        run: |
          syft "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}" \
            -o cyclonedx-json > "sbom-${SERVICE}.json"

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ inputs.service }}
          path: sbom-${{ inputs.service }}.json

      # 8. Container Vulnerability Scan
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_CACHE_DIR: /tmp/trivy
        with:
          version: v0.71.0
          image-ref: "${{ steps.meta.outputs.image }}:${{ github.sha }}"
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      # 9. Keyless Cosign Signing (Sigstore / OIDC)
      # - name: Install Cosign
      #   uses: sigstore/cosign-installer@v3.8.1

      # - name: Keyless Sign Image
      #   run: |
      #     cosign sign --yes "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"

      # 10. GCP Binary Authorization Attestation
      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Create Binary Authorization attestation
        run: |
          gcloud beta container binauthz attestations sign-and-create \
            --artifact-url="${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}" \
            --attestor="boutique-cosign" \
            --project="${GCP_PROJECT_ID}"

      # 11. Robust GitOps Values Patching via yq (Replaces sed)
      - name: Patch Dev GitOps Values
        run: |
          VALUES_FILE="gitops/envs/dev/values-${SERVICE}.yaml"
          mkdir -p gitops/envs/dev
          
          # Initialize YAML structure if file doesn't exist
          if [ ! -f "$VALUES_FILE" ]; then
            echo "image:" > "$VALUES_FILE"
          fi

          yq e -i ".image.repository = \"${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}/${SERVICE}\"" "$VALUES_FILE"
          yq e -i ".image.digest = \"${{ steps.build.outputs.digest }}\"" "$VALUES_FILE"

      # 12. Create GitOps Promotion PR
      - name: Update Dev GitOps Values and Open PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: "ci/dev-${{ inputs.service }}-${{ github.sha }}"
          title: "ci(${{ inputs.service }}): promote digest to dev"
          commit-message: "ci(${{ inputs.service }}): update dev image and digest to ${{ steps.build.outputs.digest }}"
          add-paths: |
            gitops/envs/dev/values-${{ inputs.service }}.yaml
          body: |
            Automated promotion for `${{ inputs.service }}` to **Dev**.
            
            **Image Repository:** `${{ steps.meta.outputs.image }}`  
            **Digest:** `${{ steps.build.outputs.digest }}`  
            **Commit:** `${{ github.sha }}`


