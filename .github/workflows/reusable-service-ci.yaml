name: Reusable Service CI/CD

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    environment: build
    env:
      SERVICE: ${{ inputs.service }}
      GCP_REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      AR_REPO: boutique-dev

    steps:
      # 1. Developer Push & Checkout
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # 2. Determine Language & Metadata
      - name: Resolve service metadata
        id: meta
        run: |
          json_file="scripts/services.json"
          [ -f "$json_file" ] || json_file="service.json"

          lang=$(jq -r ".[\"${SERVICE}\"].language // empty" "$json_file")
          dockerfile=$(jq -r ".[\"${SERVICE}\"].dockerfile" "$json_file")
          context=$(jq -r ".[\"${SERVICE}\"].context" "$json_file")
          
          echo "language=${lang}" >> "$GITHUB_OUTPUT"
          echo "dockerfile=${dockerfile}" >> "$GITHUB_OUTPUT"
          echo "context=${context}" >> "$GITHUB_OUTPUT"
          echo "image=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}/${SERVICE}" >> "$GITHUB_OUTPUT"

      # 3 & 4. Restore Dependencies & Unit Tests (Language Specific)
      - name: Setup Go
        if: steps.meta.outputs.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run Go tests
        if: steps.meta.outputs.language == 'go'
        run: cd ${{ steps.meta.outputs.context }} && go test ./... -v

      - name: Setup .NET
        if: steps.meta.outputs.language == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run .NET tests
        if: steps.meta.outputs.language == 'dotnet'
        run: cd ${{ steps.meta.outputs.context }} && dotnet test

      - name: Setup Node.js
        if: steps.meta.outputs.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Node tests
        if: steps.meta.outputs.language == 'node'
        run: cd ${{ steps.meta.outputs.context }} && npm ci && npm test

      - name: Setup Python
        if: steps.meta.outputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Python tests
        if: steps.meta.outputs.language == 'python'
        run: cd ${{ steps.meta.outputs.context }} && pip install -r requirements.txt && pytest

      # 5, 6 & 7. Lint, Static Analysis, Dependency Scan
      - name: Run Trivy Code / Dependency Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '${{ steps.meta.outputs.context }}'
          format: 'table'
          severity: 'HIGH,CRITICAL'

      # 6. Static Code Analysis (SonarCloud)
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ steps.meta.outputs.context }}
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_PREFIX }}_${{ inputs.service }}
            -Dsonar.sources=.
            -Dsonar.exclusions=**/node_modules/**,**/bin/**,**/obj/**,**/*.test.js
            -Dsonar.python.version=3.11

      - name: SonarCloud Quality Gate Check
        uses: sonarsource/sonarcloud-quality-gate-action@v1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        timeout-minutes: 5


      # 8. Docker Build
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f # v2.1.7
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_BUILD_SA }}

      - uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a # v2.1.4

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build image
        run: |
          docker build \
            -f "${{ steps.meta.outputs.dockerfile }}" \
            -t "${{ steps.meta.outputs.image }}:${GITHUB_SHA}" \
            "${{ steps.meta.outputs.context }}"

      # 9. Generate SBOM
      - name: Generate SBOM (syft)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft "${{ steps.meta.outputs.image }}:${GITHUB_SHA}" -o cyclonedx-json > "sbom-${SERVICE}.json"

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: sbom-${{ inputs.service }}
          path: sbom-${{ inputs.service }}.json

      # 10. Container Scan
      - name: Trivy Container Image Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ steps.meta.outputs.image }}:${{ github.sha }}"
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      # 11 & 12. Push Image & Get Digest
      - name: Push image and get digest
        id: push
        run: |
          docker push "${{ steps.meta.outputs.image }}:${GITHUB_SHA}"
          digest=$(gcloud artifacts docker images describe \
            "${{ steps.meta.outputs.image }}:${GITHUB_SHA}" \
            --format='value(image_summary.digest)')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # 13. Cosign Sign
      - name: Sign image (Cosign)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -n "${COSIGN_PRIVATE_KEY}" ]; then
            curl -fsSL -o /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/download/v2.4.3/cosign-linux-amd64
            chmod +x /usr/local/bin/cosign
            cosign sign --yes "${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}"
          fi

      # 14. Generate Attestation (Binary Authorization)
      - name: Create Binary Authorization attestation
        run: |
          gcloud beta container binauthz attestations sign-and-create \
            --artifact-url="${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}" \
            --attestor="boutique-cosign" \
            --project="${GCP_PROJECT_ID}" || true

      # 15 & 16. Update GitOps Repository & Open Pull Request (Dev Environment)
      - name: Update Dev GitOps Values and Open PR
        uses: peter-evans/create-pull-request@67ccf781d68cd99b580ae25a5c18a1cc84ffff1f # v7
        with:
          branch: "ci/dev-${{ inputs.service }}-${{ github.sha }}"
          title: "ci(${{ inputs.service }}): promote digest to dev"
          commit-message: "ci(${{ inputs.service }}): update dev digest to ${{ steps.push.outputs.digest }}"
          add-paths: |
            gitops/envs/dev/values-${{ inputs.service }}.yaml
          body: |
            Automated promotion for `${{ inputs.service }}` to **Dev**.
            Digest: `${{ steps.push.outputs.digest }}`


